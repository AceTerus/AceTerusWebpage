<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ClassPulse — School Analytics</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root {
    /* AceTerus core palette */
    --ink:         #0F172A;
    --ink-2:       #1E293B;
    --ink-50:      rgba(15,23,42,0.50);
    --ink-40:      rgba(15,23,42,0.40);
    --ink-20:      rgba(15,23,42,0.20);
    --ink-15:      rgba(15,23,42,0.15);
    --ink-10:      rgba(15,23,42,0.10);
    --ink-5:       rgba(15,23,42,0.05);

    --indigo:      #2E2BE5;
    --indigo-soft: #D6D4FF;
    --indigo-bg:   #EEEDFF;
    --blue:        #2F7CFF;
    --blue-soft:   #DDF3FF;
    --blue-bg:     #EAF4FF;
    --cyan:        #3BD6F5;
    --violet:      #7A4DFF;

    --surface:     #FFFFFF;
    --canvas:      #F8F9FF;
    --canvas-2:    #EEF1F9;

    --good:        #16A56B;
    --good-50:     #E0F5EB;
    --good-bg:     #ECFAF3;
    --warn:        #C77800;
    --warn-50:     #FBEFD6;
    --warn-bg:     #FFF6E2;
    --bad:         #DC2626;
    --bad-50:      #FBE6E1;
    --bad-bg:      #FEEFEC;

    /* AceTerus signature: hard offset shadow */
    --shadow-ink:  3px 3px 0 0 var(--ink);
    --shadow-ink-sm: 2px 2px 0 0 var(--ink);
    --shadow-ink-lg: 4px 4px 0 0 var(--ink);
    --shadow-soft: 0 1px 0 rgba(15,23,42,.04), 0 2px 6px rgba(15,23,42,.05);

    /* Border weights */
    --bw: 2.5px;
    --bw-2: 2px;

    /* Radii */
    --r-lg: 20px;
    --r-md: 14px;
    --r-sm: 10px;
    --r-xs: 8px;

    /* Type */
    --display: "Baloo 2", ui-sans-serif, system-ui, sans-serif;
    --body:    "Nunito",  ui-sans-serif, system-ui, sans-serif;
    --mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;

    --row-py: 14px;
  }
  [data-density="compact"] { --row-py: 10px; }
  [data-density="comfortable"] { --row-py: 18px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body);
    font-weight: 600;
    color: var(--ink);
    background: var(--canvas);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .display { font-family: var(--display); font-weight: 800; letter-spacing: -0.015em; }
  .mono    { font-family: var(--mono); font-feature-settings: "tnum"; }
  .tnum    { font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--indigo); color: #fff; }

  /* ─────────────── Top bar ─────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    height: 56px; background: #fff;
    border-bottom: var(--bw) solid var(--ink);
    box-shadow: 0 2px 0 0 var(--ink);
  }
  .topbar-inner {
    max-width: 1320px; margin: 0 auto; padding: 0 22px;
    height: 100%; display: flex; align-items: center; gap: 18px;
  }
  .brand { display:flex; align-items:center; gap: 11px; }
  .brand-logo {
    width: 32px; height: 32px; border-radius: 10px;
    background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    border: var(--bw-2) solid var(--ink);
    box-shadow: 2px 2px 0 0 var(--ink);
    position: relative;
  }
  .brand-logo svg { width: 18px; height: 18px; color: #fff; }
  .brand-text {
    font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink);
    letter-spacing: -0.01em; line-height: 1;
  }
  .brand-text em { font-style: normal; color: var(--blue); }
  .brand-pill {
    font-family: var(--body); font-weight: 800; font-size: 10px;
    color: var(--ink-50); letter-spacing: 0.04em; text-transform: uppercase;
    border: var(--bw-2) solid var(--ink-20); border-radius: 999px;
    padding: 3px 8px; line-height: 1;
  }
  .topnav { display:flex; gap: 4px; margin-left: 10px; }
  .topnav a {
    font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--ink-50);
    padding: 7px 12px; border-radius: 10px;
    border: var(--bw-2) solid transparent;
  }
  .topnav a.active {
    background: var(--ink); color: #fff;
    border-color: var(--ink); box-shadow: var(--shadow-ink-sm);
  }
  .topnav a:hover:not(.active) { color: var(--ink); border-color: var(--ink-20); }

  .topbar-right { margin-left: auto; display:flex; align-items:center; gap: 10px; }
  .userchip {
    display:flex; align-items:center; gap:10px;
    padding: 4px 12px 4px 4px;
    background: #fff;
    border: var(--bw-2) solid var(--ink); border-radius: 999px;
    box-shadow: var(--shadow-ink-sm);
  }
  .userchip .avatar {
    width: 26px; height: 26px; border-radius: 999px;
    background: var(--indigo);
    color: #fff; font-family: var(--display); font-weight: 800; font-size: 12px;
    display:flex; align-items:center; justify-content:center;
    border: 2px solid var(--ink);
  }
  .userchip .who { font-family: var(--body); font-size: 12.5px; font-weight: 800; color: var(--ink); line-height: 1.15; }
  .userchip .who small { display:block; color: var(--ink-50); font-weight: 700; font-size: 10.5px; }

  /* ─────────────── Page ─────────────── */
  .page { max-width: 1320px; margin: 0 auto; padding: 26px 22px 80px; }

  /* Page header */
  .ph { display:flex; align-items:flex-end; justify-content: space-between; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .ph-left { display:flex; align-items:center; gap: 14px; }
  .ph-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--indigo);
    border: var(--bw) solid var(--ink); box-shadow: var(--shadow-ink);
    display: flex; align-items: center; justify-content: center;
  }
  .ph-icon svg { width: 24px; height: 24px; color: #fff; }
  .ph h1 {
    font-family: var(--display); font-weight: 800; font-size: 26px;
    letter-spacing: -0.02em; line-height: 1.05; margin: 0;
    color: var(--ink);
  }
  .ph-sub { font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--ink-50); margin-top: 4px; }
  .crumbs {
    font-family: var(--body); font-size: 11.5px; font-weight: 700; color: var(--ink-40);
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .crumbs .sep { color: var(--ink-20); }

  /* ─────────────── Buttons ─────────────── */
  .toolbar { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
  .seg {
    display:flex; background: #fff;
    border: var(--bw-2) solid var(--ink); border-radius: 12px; padding: 3px;
    box-shadow: var(--shadow-ink-sm);
  }
  .seg button {
    border: 0; background: transparent; padding: 6px 12px; border-radius: 8px;
    font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--ink-50);
    white-space: nowrap;
  }
  .seg button.on { background: var(--ink); color: #fff; }

  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 8px 14px; border-radius: 12px;
    font-family: var(--body); font-size: 13px; font-weight: 800; line-height: 1;
    background: #fff; color: var(--ink);
    border: var(--bw-2) solid var(--ink);
    box-shadow: var(--shadow-ink-sm);
    transition: transform .08s, box-shadow .08s, background .12s;
  }
  .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 0 var(--ink); }
  .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 var(--ink); }
  .btn.primary { background: var(--indigo); color: #fff; }
  .btn.ghost { background: transparent; border-color: var(--ink-20); box-shadow: none; color: var(--ink-50); }
  .btn.ghost:hover { color: var(--ink); border-color: var(--ink); transform: none; box-shadow: none; background: var(--ink-5); }
  .btn .ico { width: 14px; height: 14px; }

  /* ─────────────── Cards ─────────────── */
  .card {
    background: #fff;
    border: var(--bw) solid var(--ink);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-ink);
  }
  .card-flat {
    background: #fff;
    border: var(--bw-2) solid var(--ink-15);
    border-radius: var(--r-md);
  }

  .section-head {
    display:flex; align-items: baseline; gap: 10px; justify-content: space-between;
    margin: 28px 0 12px;
  }
  .section-head h2 {
    font-family: var(--display); font-weight: 800; font-size: 19px;
    letter-spacing: -0.015em; margin: 0; color: var(--ink);
  }
  .section-head .meta { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--ink-50); }
  .eyebrow {
    font-family: var(--body); font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-50);
  }

  /* ─────────────── Hero KPI strip ─────────────── */
  .hero {
    border: var(--bw) solid var(--ink);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-ink);
    background:
      radial-gradient(ellipse 80% 60% at 100% 0%, rgba(255,255,255,.12) 0%, rgba(255,255,255,0) 60%),
      linear-gradient(135deg, #2E2BE5 0%, #2F7CFF 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .hero-top {
    padding: 18px 22px 0;
    display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  }
  .hero-top .l { display:flex; align-items:center; gap: 10px; }
  .hero-top h3 {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 17px;
    letter-spacing: -0.01em;
  }
  .hero-top .badge {
    display:inline-flex; align-items:center; gap: 6px;
    background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.22);
    border-radius: 999px; padding: 4px 10px;
    font-family: var(--body); font-weight: 800; font-size: 11px; color: #fff;
  }
  .hero-top .badge .dot { width: 6px; height: 6px; border-radius: 999px; background: #fff; }

  .kpis {
    display: grid; grid-template-columns: repeat(5, minmax(0,1fr));
    gap: 10px; padding: 14px 18px 18px;
  }
  .kpi {
    background: rgba(255,255,255,0.13);
    border: var(--bw-2) solid rgba(255,255,255,0.22);
    border-radius: 14px;
    padding: 14px 16px;
    position: relative; min-width: 0;
  }
  .kpi .lbl {
    font-family: var(--body); font-size: 11px; font-weight: 800;
    color: rgba(255,255,255,0.78); letter-spacing: 0.02em;
    display:flex; align-items:center; gap: 6px; margin-bottom: 6px;
  }
  .kpi .val {
    font-family: var(--display); font-weight: 800; font-size: 32px;
    letter-spacing: -0.022em; line-height: 1; color: #fff;
  }
  .kpi .delta {
    margin-top: 6px; font-family: var(--body); font-size: 11px; font-weight: 800;
    display:flex; align-items:center; gap: 4px;
  }
  .kpi .delta.up { color: #B6F7CE; }
  .kpi .delta.down { color: #FFC4B7; }
  .kpi .delta.flat { color: rgba(255,255,255,.7); }
  .kpi .spark {
    position: absolute; right: 12px; top: 12px; width: 60px; height: 20px; opacity: .9;
  }
  @media (max-width: 980px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }

  /* ─────────────── Two-col layout ─────────────── */
  .grid-2 { display:grid; gap: 16px; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); margin-top: 14px; }
  @media (max-width: 1080px) { .grid-2 { grid-template-columns: 1fr; } }

  /* Subject bar chart */
  .panel-h { padding: 16px 20px 4px; display:flex; align-items: baseline; justify-content: space-between; }
  .panel-h h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 15px; color: var(--ink); }
  .panel-h .right { font-family: var(--body); font-size: 11.5px; font-weight: 700; color: var(--ink-50); }
  .subjects { padding: 8px 20px 20px; }
  .subject-row {
    display:grid; grid-template-columns: 130px 1fr 56px 70px; gap: 12px;
    align-items: center; padding: 10px 0; border-bottom: 1.5px dashed var(--ink-10);
  }
  .subject-row:last-child { border-bottom: 0; }
  .subject-row .name { font-family: var(--body); font-size: 13px; font-weight: 800; color: var(--ink); }
  .subject-row .bar { height: 10px; background: var(--canvas-2); border-radius: 999px; position: relative; overflow: hidden; border: 1.5px solid var(--ink-10); }
  .subject-row .bar > i {
    position:absolute; inset: 0 auto 0 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--indigo) 0%, var(--blue) 100%);
  }
  .subject-row .bar.good > i { background: linear-gradient(90deg, var(--good) 0%, #38C58A 100%); }
  .subject-row .bar.warn > i { background: linear-gradient(90deg, var(--warn) 0%, #ECB44A 100%); }
  .subject-row .bar.bad > i  { background: linear-gradient(90deg, var(--bad) 0%, #F58D75 100%); }
  .subject-row .pct  { font-family: var(--display); font-weight: 800; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  .subject-row .ses  { font-family: var(--body); font-size: 11.5px; font-weight: 700; color: var(--ink-50); text-align: right; }

  /* Heatmap */
  .heat { padding: 4px 20px 20px; }
  .heat-grid { display:grid; grid-template-columns: 120px repeat(7, 1fr); gap: 4px; align-items: center; }
  .heat-h, .heat-l { font-family: var(--body); font-size: 10.5px; color: var(--ink-50); font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
  .heat-l { padding-right: 6px; }
  .heat-cell {
    aspect-ratio: 1.4 / 1; border-radius: 6px; background: var(--canvas-2);
    border: 1.5px solid var(--ink-10);
    position: relative; transition: transform .12s;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--body); font-weight: 800; font-size: 10.5px;
  }
  .heat-cell:hover { transform: scale(1.08); border-color: var(--ink); z-index: 1; }
  .heat-legend { margin-top: 12px; display:flex; align-items:center; gap: 8px; font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--ink-50); }
  .heat-legend .scale { display:flex; gap: 2px; }
  .heat-legend .scale i { width: 18px; height: 10px; border-radius: 3px; display:block; border: 1px solid var(--ink-10); }

  /* Pills */
  .pill {
    display:inline-flex; align-items:center; gap:5px;
    font-family: var(--body); font-size: 11px; font-weight: 800; padding: 3px 9px;
    border-radius: 999px; line-height: 1; border: 1.5px solid transparent; white-space: nowrap;
  }
  .pill .pill-dot { width: 5px; height: 5px; border-radius: 999px; }
  .pill.good { color: var(--good); background: var(--good-bg); border-color: color-mix(in oklch, var(--good) 22%, white); }
  .pill.good .pill-dot { background: var(--good); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); border-color: color-mix(in oklch, var(--warn) 22%, white); }
  .pill.warn .pill-dot { background: var(--warn); }
  .pill.bad  { color: var(--bad);  background: var(--bad-bg);  border-color: color-mix(in oklch, var(--bad) 22%, white); }
  .pill.bad  .pill-dot { background: var(--bad); }
  .pill.neutral { color: var(--ink-50); background: var(--canvas-2); border-color: var(--ink-10); }
  .pill.neutral .pill-dot { background: var(--ink-40); }
  .pill.tag { color: var(--ink); background: #fff; border-color: var(--ink-15); font-weight: 800; }
  .pill.subject { color: var(--blue); background: var(--blue-soft); border-color: color-mix(in oklch, var(--blue) 22%, white); font-weight: 800; }
  .pill.indigo  { color: var(--indigo); background: var(--indigo-bg); border-color: color-mix(in oklch, var(--indigo) 22%, white); font-weight: 800; }

  /* ─────────────── Flag banner ─────────────── */
  .flag-banner {
    display:flex; align-items:center; justify-content: space-between; gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(90deg, #FFF1ED 0%, #FFFFFF 80%);
    border: var(--bw) solid var(--bad);
    border-radius: var(--r-lg);
    box-shadow: 3px 3px 0 0 var(--bad);
    margin-bottom: 16px;
  }
  .flag-banner .l { display:flex; align-items:center; gap: 12px; }
  .flag-banner .ic {
    width: 36px; height: 36px; border-radius: 10px; background: var(--bad);
    display:flex; align-items:center; justify-content:center; color: #fff;
    border: var(--bw-2) solid var(--ink);
  }
  .flag-banner h4 { margin: 0; font-family: var(--display); font-size: 15px; font-weight: 800; color: var(--ink); }
  .flag-banner p { margin: 2px 0 0; font-family: var(--body); font-size: 12.5px; font-weight: 700; color: var(--ink-50); }

  /* ─────────────── Filter chips ─────────────── */
  .filters { display:flex; gap: 8px; align-items:center; flex-wrap: wrap; }
  .chip {
    display:inline-flex; align-items:center; gap: 6px;
    padding: 6px 11px; border-radius: 10px;
    border: var(--bw-2) solid var(--ink-20);
    background: #fff;
    font-family: var(--body); font-size: 12px; font-weight: 800; color: var(--ink-50);
  }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--shadow-ink-sm); }
  .chip:hover:not(.on) { color: var(--ink); border-color: var(--ink); }
  .chip .count {
    background: var(--canvas-2); color: var(--ink);
    padding: 1px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 800;
  }
  .chip.on .count { background: rgba(255,255,255,.22); color: #fff; }

  /* ─────────────── Teacher table ─────────────── */
  .table-card {
    background: #fff;
    border: var(--bw) solid var(--ink);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-ink);
    overflow: hidden;
  }
  .thead, .trow {
    display:grid;
    grid-template-columns: 36px minmax(220px, 1.3fr) 110px 1.2fr 110px 100px 90px 80px;
    align-items: center; gap: 14px; padding: 0 20px;
  }
  .thead {
    height: 42px; background: var(--canvas);
    border-bottom: var(--bw-2) solid var(--ink);
    font-family: var(--body); font-size: 11px; font-weight: 800;
    color: var(--ink-50); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .thead .sortable { cursor: pointer; display:inline-flex; align-items:center; gap: 4px; }
  .thead .sortable:hover { color: var(--ink); }
  .trow {
    min-height: 68px; padding-top: var(--row-py); padding-bottom: var(--row-py);
    border-bottom: 1.5px solid var(--ink-10);
    transition: background .12s;
  }
  .trow:hover { background: #F6F7FF; }
  .trow:last-child { border-bottom: 0; }

  .trow .expander {
    width: 28px; height: 28px; border-radius: 8px;
    border: var(--bw-2) solid var(--ink-20); background: #fff;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-50); transition: transform .18s, color .12s, background .12s, border-color .12s;
  }
  .trow:hover .expander { border-color: var(--ink); color: var(--ink); }
  .trow.open .expander { transform: rotate(90deg); color: #fff; background: var(--ink); border-color: var(--ink); }

  .teacher { display:flex; align-items:center; gap: 12px; min-width: 0; }
  .ava {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display:flex; align-items:center; justify-content:center; color: #fff;
    font-family: var(--display); font-weight: 800; font-size: 15px;
    border: var(--bw-2) solid var(--ink);
    box-shadow: 2px 2px 0 0 var(--ink);
  }
  .teacher .info { min-width: 0; }
  .teacher .name { font-family: var(--body); font-size: 14px; font-weight: 800; letter-spacing: -0.005em; color: var(--ink); line-height: 1.2; }
  .teacher .role { font-family: var(--body); font-size: 11.5px; color: var(--ink-50); font-weight: 700; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }

  .coverage-cell { display:flex; align-items:center; gap: 10px; }
  .ring {
    width: 40px; height: 40px; flex-shrink: 0; position: relative;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--display); font-weight: 800; font-size: 12px; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .trend-cell { display:flex; align-items:center; gap: 8px; }
  .trend-cell .num { font-family: var(--body); font-size: 12.5px; font-weight: 800; }

  .sessions-cell, .goals-cell, .last-cell {
    font-family: var(--body); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .sessions-cell .big { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--ink); }
  .sessions-cell .small { font-size: 11px; color: var(--ink-50); margin-left: 4px; font-weight: 700; }

  .goal-bar {
    width: 76px; height: 7px; background: var(--canvas-2); border-radius: 999px;
    position: relative; overflow: hidden; margin-top: 5px;
    border: 1.5px solid var(--ink-10);
  }
  .goal-bar > i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 999px; }
  .goals-cell .gtxt { font-family: var(--display); font-weight: 800; font-size: 13px; color: var(--ink); }

  .last-cell .date { font-family: var(--body); font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .last-cell .ago  { font-family: var(--body); font-size: 11px; color: var(--ink-50); font-weight: 700; }

  .actions-cell { text-align: right; }

  /* Expanded teacher row */
  .expand-shell {
    grid-column: 1 / -1; padding: 0 0 0 56px; margin: 0 -20px;
    background: #FAFBFF;
    border-top: 1.5px solid var(--ink-10);
  }
  .expand-inner { padding: 16px 28px 20px 0; }
  .expand-inner .head { display:flex; align-items:center; justify-content: space-between; margin-bottom: 10px; }
  .expand-inner .head h4 {
    font-family: var(--body); font-size: 11px; font-weight: 800; margin: 0; color: var(--ink-50);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* Sessions table inside expand */
  .stable {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: #fff;
    border: var(--bw-2) solid var(--ink); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow-ink-sm);
  }
  .stable thead th {
    text-align: left; font-family: var(--body); font-size: 10.5px; font-weight: 800;
    color: var(--ink-50); text-transform: uppercase; letter-spacing: 0.05em;
    padding: 10px 14px; background: var(--canvas);
    border-bottom: 1.5px solid var(--ink-15);
  }
  .stable tbody td {
    padding: 12px 14px; font-family: var(--body); font-size: 13px; font-weight: 700;
    border-bottom: 1.5px solid var(--ink-10);
    color: var(--ink); vertical-align: middle;
  }
  .stable tbody tr:last-child td { border-bottom: 0; }
  .stable tbody tr:hover { background: #F4F6FF; cursor: pointer; }
  .concept-mini { display:inline-flex; gap: 3px; align-items:center; }
  .concept-mini i {
    width: 14px; height: 6px; border-radius: 2px; background: var(--good); display:inline-block;
  }
  .concept-mini i.miss { background: var(--bad); opacity: .9; }

  .sub-cover { display:flex; align-items:center; gap:8px; }
  .sub-cover .mini-bar {
    width: 64px; height: 7px; background: var(--canvas-2); border-radius: 999px;
    position: relative; overflow: hidden; border: 1.5px solid var(--ink-10);
  }
  .sub-cover .mini-bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; }
  .sub-cover .pctxt { font-family: var(--display); font-weight: 800; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* ─────────────── Drawer ─────────────── */
  .drawer-scrim {
    position: fixed; inset: 0; background: rgba(15,23,42,.50);
    backdrop-filter: blur(4px);
    z-index: 80;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 580px; max-width: 100vw; background: #fff;
    border-left: var(--bw) solid var(--ink);
    z-index: 90; transform: translateX(100%);
    transition: transform .28s cubic-bezier(.4,.0,.2,1);
    display:flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }
  .drawer-head {
    padding: 18px 22px; border-bottom: var(--bw-2) solid var(--ink);
    display:flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    background: var(--canvas);
  }
  .drawer-head h3 {
    font-family: var(--display); font-weight: 800; font-size: 19px; margin: 6px 0 2px;
    letter-spacing: -0.015em; color: var(--ink);
  }
  .drawer-head .meta { font-family: var(--body); font-size: 12px; font-weight: 700; color: var(--ink-50); }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 10px;
    border: var(--bw-2) solid var(--ink-20);
    background: #fff;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink-50);
  }
  .icon-btn:hover { border-color: var(--ink); color: var(--ink); background: var(--ink-5); }
  .drawer-body { flex: 1; overflow-y: auto; padding: 18px 22px 30px; }
  .drawer-body h4 {
    font-family: var(--body); font-size: 11px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-50);
    margin: 22px 0 10px;
  }
  .drawer-body h4:first-child { margin-top: 0; }
  .obj-box {
    background: var(--indigo-bg);
    border: var(--bw-2) solid color-mix(in oklch, var(--indigo) 25%, white);
    border-radius: 14px; padding: 14px 16px;
    font-family: var(--body); font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.5;
  }
  .stats-3 { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat-box {
    background: #fff; border: var(--bw-2) solid var(--ink-15);
    border-radius: 12px; padding: 12px 14px;
  }
  .stat-box .v { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.02em; color: var(--ink); }
  .stat-box .k { font-family: var(--body); font-size: 11px; color: var(--ink-50); font-weight: 800; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  .concept-list { display:flex; flex-wrap: wrap; gap: 6px; }
  .concept-list .c {
    display:inline-flex; align-items:center; gap: 5px;
    font-family: var(--body); font-size: 12px; font-weight: 800;
    padding: 5px 10px; border-radius: 10px; border: 1.5px solid;
  }
  .c.ok   { background: var(--good-bg); color: var(--good); border-color: color-mix(in oklch, var(--good) 25%, white); }
  .c.miss { background: var(--bad-bg);  color: var(--bad);  border-color: color-mix(in oklch, var(--bad)  25%, white); }

  .transcript {
    background: var(--canvas);
    border: var(--bw-2) solid var(--ink-15);
    border-radius: 12px; padding: 14px;
    font-family: var(--body); font-size: 13px; font-weight: 600;
    color: var(--ink); line-height: 1.55;
    max-height: 280px; overflow-y: auto; white-space: pre-wrap;
  }
  .transcript .line { padding: 5px 0; }
  .transcript .ts { font-family: var(--mono); font-size: 11px; color: var(--ink-40); margin-right: 8px; }
  .transcript .who { font-weight: 800; margin-right: 6px; }
  .transcript .who.t { color: var(--indigo); }
  .transcript .who.s { color: var(--blue); }

  .coach {
    background: linear-gradient(180deg, #F4F3FF 0%, #FFFFFF 100%);
    border: var(--bw-2) solid color-mix(in oklch, var(--indigo) 25%, white);
    border-radius: 14px; padding: 14px 16px;
    position: relative;
  }
  .coach .h {
    display:flex; align-items:center; gap: 8px;
    font-family: var(--body); font-size: 11px; font-weight: 800;
    color: var(--indigo); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .coach p { margin: 0; font-family: var(--body); font-size: 13.5px; font-weight: 700;
    color: var(--ink); line-height: 1.5; }

  /* Compact density */
  [data-density="compact"] .trow { min-height: 56px; }
  [data-density="compact"] .ava { width: 34px; height: 34px; font-size: 13px; }
  [data-density="compact"] .teacher .name { font-size: 13px; }

  /* Misc */
  .transcript::-webkit-scrollbar { width: 6px; }
  .transcript::-webkit-scrollbar-thumb { background: var(--ink-15); border-radius: 3px; }
  .drawer-body::-webkit-scrollbar { width: 6px; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--ink-15); border-radius: 3px; }
</style>

</head>
<body data-density="comfortable">

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>

</body>
